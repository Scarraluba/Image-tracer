<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <!-- Background with Safe Padding -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer Anatomical Grid & Coordinate Axes -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="256" y1="50" x2="256" y2="462" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="50" y1="256" x2="462" y2="256" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Sclera Contour -->
  <path d="M 96 256 Q 256 130 416 256 Q 256 382 96 256 Z" fill="#0f172a" stroke="url(#skyGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Iris & Pupil with Gaze Crosshairs -->
  <circle cx="256" cy="256" r="68" fill="url(#irisGrad)" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="256" cy="256" r="26" fill="#020617"/>
  <circle cx="244" cy="244" r="8" fill="#ffffff" opacity="0.8"/>

  <!-- Target Ray Marker (Green Hit) -->
  <circle cx="310" cy="220" r="6" fill="#22c55e"/>
  <line x1="256" y1="256" x2="310" y2="220" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="3,3"/>
  <circle cx="310" cy="220" r="14" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>

  <text x="256" y="440" font-family="monospace, sans-serif" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">EYEW 3D</text>
</svg>
